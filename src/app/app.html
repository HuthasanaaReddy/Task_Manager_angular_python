<h2>Task Manager</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <input formControlName="title" placeholder="Title"><br>
  <input formControlName="description" placeholder="Description"><br>

  <select formControlName="status">
    <option>Start</option>
    <option>In Progress</option>
    <option>Completed</option>
  </select>

  <br><br>
  <button type="submit">Save</button>
</form>

<hr>

<table border="1">
  <tr>
    <th>Title</th>
    <th>Status</th>
    <th>Description</th>
    <th>Actions</th>
  </tr>

  @for (t of tasks$ | async; track t.id) {
    <tr>
      <td>{{ t.title }}</td>
      <td>{{ t.status }}</td>
      <td>{{ t.description }}</td>
      <td>
        <button (click)="edit(t)">Edit</button>
        <button (click)="delete(t.id)">Delete</button>
      </td>
    </tr>
  }
</table>
